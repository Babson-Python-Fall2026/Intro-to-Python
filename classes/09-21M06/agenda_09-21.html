<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Computational Thinking with AI and Python — September 21, 2026</title>
<style>
:root{color-scheme:light;--paper:#f6f3e9;--ink:#142d32;--green:#006756;--line:#c7d1c9}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.4}
main{max-width:1200px;margin:0 auto;padding:48px 64px 56px}
.course{margin:0 0 16px;color:var(--green);font-size:16px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
h1{font-size:clamp(34px,4.2vw,58px);line-height:1.1;letter-spacing:-.035em;margin:0 0 20px;max-width:1050px}
.date{font-size:clamp(22px,2.5vw,30px);margin:0 0 30px;color:var(--green)}
.agenda{list-style:none;counter-reset:agenda;padding:0;margin:0;border-top:2px solid var(--green)}
.agenda>li{counter-increment:agenda;display:grid;grid-template-columns:54px 1fr;gap:16px;padding:22px 0;border-bottom:1px solid var(--line)}
.agenda>li::before{content:counter(agenda) ")";font-size:30px;font-weight:700;color:var(--green)}
h2{font-size:clamp(23px,2.6vw,32px);font-weight:600;line-height:1.3;margin:0}
.substeps{list-style-type:lower-alpha;font-size:clamp(20px,2vw,25px);margin:12px 0 0;padding-left:30px}
.substeps li{padding-left:4px;margin:6px 0}
.due{font-size:clamp(20px,2vw,25px);margin:8px 0 0;color:var(--green)}
@media(max-width:650px){main{padding:30px 24px}.agenda>li{grid-template-columns:36px 1fr;gap:10px}.agenda>li::before{font-size:25px}}
@media print{@page{size:landscape;margin:12mm}body{background:white}main{max-width:none;padding:10px 24px}h1{font-size:38px}.course{font-size:13px;margin-bottom:10px}.date{font-size:23px;margin-bottom:20px}.agenda>li{padding:15px 0;break-inside:avoid}h2{font-size:25px}.substeps,.due{font-size:20px}.agenda>li::before{font-size:25px}}
</style>
</head>
<body>
<main>
<p class="course">OIM3600 · Class agenda</p>
<h1>Computational Thinking with AI and Python</h1>
<p class="date"><time datetime="2026-09-21">Monday, September 21st, 2026</time></p>
<ol class="agenda">
<li><div><h2>Questions</h2></div></li>
<li><div><h2>Review homework and chat: C1</h2></div></li>
<li><div><h2>Abstraction, Decomposition and Patterns</h2></div></li>
<li><div style="display:flex; align-items:baseline; gap:20px;">
    <h2>Class Exercises</h2>
    <h3>Sections 1 - 6</h3>
</div></li>
</ol>
</main>
</body>
</html>
